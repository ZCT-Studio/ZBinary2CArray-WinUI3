name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

env:
  CONFIGURATION: Release
  PROJECT_FILE: ZBinary2CArray-WinUI3.vcxproj

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86, x64, ARM64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: 'latest'

      - name: Restore NuGet packages
        run: nuget restore ${{ env.PROJECT_FILE }} -NonInteractive -PackagesDirectory ./packages

      - name: Determine MSBuild Platform
        id: platform
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $platform = if ($arch -eq 'x86') { 'Win32' } else { $arch }
          Write-Host "Arch=$arch, Platform=$platform"
          echo "platform=$platform" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          $platform = '${{ steps.platform.outputs.platform }}'
          Write-Host "Building for platform: $platform"
          & msbuild ${{ env.PROJECT_FILE }} `
            /t:Build `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:Platform=$platform `
            /p:AppxPackage=false `
            /p:WindowsAppSdkBootstrapInitialize=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:UseVCLibStl=false `
            /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##error:Build failed for $platform"
            exit 1
          }

      - name: Stage output
        shell: pwsh
        run: |
          $platform = '${{ steps.platform.outputs.platform }}'
          $buildOutput = ".\$platform\${{ env.CONFIGURATION }}"
          $staging = ".\staging\ZBinary2CArray-WinUI3"

          Write-Host "=== Build output: $buildOutput ==="
          if (Test-Path $buildOutput) {
            Get-ChildItem $buildOutput -File | Select-Object -First 50 |
              ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "  Directory does not exist!"
            exit 1
          }

          New-Item -ItemType Directory -Path $staging -Force | Out-Null

          # Copy EXE, DLLs, and other runtime files
          Get-ChildItem $buildOutput -File | Where-Object {
            $_.Extension -in '.exe', '.dll', '.json', '.winmd'
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination $staging
          }

          # Copy Locales folder
          $locales = Join-Path $buildOutput 'Locales'
          if (-not (Test-Path $locales)) { $locales = '.\Locales' }
          if (Test-Path $locales) {
            Copy-Item $locales -Destination $staging -Recurse
          }

          # Copy Assets folder
          if (Test-Path '.\Assets') {
            Copy-Item '.\Assets' -Destination $staging -Recurse
          }

          # Ensure VC++ runtime DLLs are present
          $vcDlls = @('vcruntime140.dll', 'msvcp140.dll', 'vcruntime140_1.dll', 'concrt140.dll')
          foreach ($dll in $vcDlls) {
            $dest = Join-Path $staging $dll
            if (-not (Test-Path $dest)) {
              # Search VC++ redist
              $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
              $redistDir = Get-ChildItem -Path (Join-Path $vsRoot 'VC\Redist\MSVC') -Directory -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending | Select-Object -First 1
              if ($redistDir) {
                $redistArch = if ('${{ matrix.arch }}' -eq 'ARM64') { 'arm64' }
                              elseif ('${{ matrix.arch }}' -eq 'x86') { 'x86' }
                              else { 'x64' }
                $src = Join-Path $redistDir.FullName "$redistArch\Microsoft.VC143.CRT\$dll"
                if (Test-Path $src) {
                  Copy-Item $src -Destination $dest
                  Write-Host "  Copied $dll from VC++ redist"
                }
              }
            }
          }

          Write-Host "=== Staged contents ==="
          Get-ChildItem $staging -Recurse | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path $staging).Path.Length + 1)
            Write-Host "  $rel"
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          $stagingParent = '.\staging'
          $zipPath = ".\ZBinary2CArray-WinUI3_${{ matrix.arch }}.zip"
          Push-Location $stagingParent
          try {
            Compress-Archive -Path 'ZBinary2CArray-WinUI3' -DestinationPath "..\$(Split-Path -Leaf $zipPath)" -Force
          } finally {
            Pop-Location
          }
          Write-Host "Created: $zipPath"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZBinary2CArray-WinUI3-${{ matrix.arch }}
          path: ./ZBinary2CArray-WinUI3_${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: |
            ${{ steps.platform.outputs.platform }}/${{ env.CONFIGURATION }}/**/*.log
            ${{ steps.platform.outputs.platform }}/${{ env.CONFIGURATION }}/**/*.err
          if-no-files-found: warn

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect ZIP files
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          mkdir -p release
          echo "=== Artifacts directory ==="
          ls -laR artifacts/ || echo "artifacts/ is empty or missing"
          for dir in artifacts/*/; do
            dirname=$(basename "$dir")
            arch=$(echo "$dirname" | grep -oP '(x86|x64|ARM64)' || true)
            zip=$(find "$dir" -name '*.zip' -type f | head -1)
            if [ -n "$zip" ] && [ -n "$arch" ]; then
              cp "$zip" "release/ZBinary2CArray-WinUI3_${arch}.zip"
              echo "Added: ZBinary2CArray-WinUI3_${arch}.zip"
            else
              echo "WARNING: no zip found in $dir (arch=$arch, dirname=$dirname)"
            fi
          done
          echo "--- Final release files ---"
          ls -la release/
          count=$(find release -name '*.zip' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "##error:No ZIP files collected!"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
