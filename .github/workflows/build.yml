name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

env:
  CONFIGURATION: Release
  PROJECT_FILE: ZBinary2CArray-WinUI3.vcxproj

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86, x64, ARM64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: 'latest'

      - name: Restore NuGet packages
        run: nuget restore ${{ env.PROJECT_FILE }} -NonInteractive -PackagesDirectory ./packages

      - name: Determine MSBuild Platform
        id: platform
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $platform = if ($arch -eq 'x86') { 'Win32' } else { $arch }
          Write-Host "Arch=$arch, Platform=$platform"
          echo "platform=$platform" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          $platform = '${{ steps.platform.outputs.platform }}'
          Write-Host "Building for platform: $platform"
          & msbuild ${{ env.PROJECT_FILE }} `
            /t:Build `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:Platform=$platform `
            /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##error:Build failed for $platform"
            exit 1
          }

      - name: Stage output
        shell: pwsh
        run: |
          # Output path varies by platform:
          # x64:  x64\Release\ZBinary2CArray-WinUI3\
          # ARM64: ARM64\Release\ZBinary2CArray-WinUI3\
          # Win32: Release\ZBinary2CArray-WinUI3\  (no platform prefix!)
          $exePath = Get-ChildItem '.' -Filter 'ZBinary2CArray_WinUI3.exe' -Recurse |
            Where-Object { $_.FullName -match 'Release' -and $_.Directory.Name -eq 'ZBinary2CArray-WinUI3' } |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $exePath) {
            Write-Host "##error:Could not find ZBinary2CArray_WinUI3.exe"
            Get-ChildItem '.' -Directory | ForEach-Object { Write-Host "  DIR: $($_.Name)" }
            exit 1
          }

          $buildBinDir = Split-Path $exePath
          Write-Host "=== Build output: $buildBinDir ==="

          # Create staging: staging\ZBinary2CArray-WinUI3\
          $staging = '.\staging'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path (Join-Path $staging 'ZBinary2CArray-WinUI3') -Force | Out-Null

          $dest = Join-Path $staging 'ZBinary2CArray-WinUI3'

          # Copy all top-level files (exe, dll, json, winmd)
          Get-ChildItem $buildBinDir -File | ForEach-Object {
            Copy-Item $_.FullName -Destination $dest
          }

          # Copy subdirs except AppX (duplicate)
          Get-ChildItem $buildBinDir -Directory | Where-Object { $_.Name -ne 'AppX' } | ForEach-Object {
            Copy-Item $_.FullName -Destination $dest -Recurse
          }

          # Ensure Locales exist
          if (-not (Test-Path (Join-Path $dest 'Locales'))) {
            if (Test-Path '.\Locales') {
              Copy-Item '.\Locales' -Destination $dest -Recurse
            }
          }

          Write-Host "=== Staged contents (top 60) ==="
          Get-ChildItem $dest -Recurse -File | Select-Object -First 60 | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path $dest).Path.Length + 1)
            Write-Host "  $rel"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZBinary2CArray-WinUI3-${{ matrix.arch }}
          path: ./staging/ZBinary2CArray-WinUI3
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: |
            ${{ steps.platform.outputs.platform }}/${{ env.CONFIGURATION }}/**/*.log
            ${{ steps.platform.outputs.platform }}/${{ env.CONFIGURATION }}/**/*.err
          if-no-files-found: warn

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Package release ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          for dir in artifacts/*/; do
            dirname=$(basename "$dir")
            arch=$(echo "$dirname" | grep -oP '(x86|x64|ARM64)') || continue
            zipname="ZBinary2CArray-WinUI3_${arch}.zip"

            # download-artifact v4 extracts the artifact contents directly
            # so $dir contains the ZBinary2CArray-WinUI3 folder structure
            # We need to wrap it so the ZIP contains ZBinary2CArray-WinUI3/ folder

            tmpdir=$(mktemp -d)
            # The artifact may already be the folder contents, or it may have one extra level
            # Check what's inside
            inner_count=$(find "$dir" -maxdepth 1 | wc -l)
            if [ "$inner_count" -eq 2 ] && [ -d "${dir}ZBinary2CArray-WinUI3" ]; then
              # Already has the right folder name
              mv "${dir}ZBinary2CArray-WinUI3" "$tmpdir/"
            else
              # Contents are directly in $dir, wrap them
              mkdir -p "$tmpdir/ZBinary2CArray-WinUI3"
              cp -r "$dir"* "$tmpdir/ZBinary2CArray-WinUI3/" 2>/dev/null || true
            fi

            # Create the ZIP
            cd "$tmpdir"
            zip -r -q "$GITHUB_WORKSPACE/release/$zipname" ZBinary2CArray-WinUI3/
            cd "$GITHUB_WORKSPACE"
            rm -rf "$tmpdir"

            echo "Created: $zipname"
          done

          echo "--- Final release files ---"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
