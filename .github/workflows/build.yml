name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

env:
  CONFIGURATION: Release
  PROJECT_FILE: ZBinary2CArray-WinUI3.vcxproj

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86, x64, ARM64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: 'latest'

      - name: Restore NuGet packages
        run: nuget restore ${{ env.PROJECT_FILE }} -NonInteractive -PackagesDirectory ./packages

      - name: Determine MSBuild Platform
        id: platform
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          if ($arch -eq 'x86') {
            $platform = 'Win32'
          } else {
            $platform = $arch
          }
          Write-Host "Arch=$arch, Platform=$platform"
          echo "platform=$platform" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          $platform = '${{ steps.platform.outputs.platform }}'
          Write-Host "Building for platform: $platform"
          & msbuild ${{ env.PROJECT_FILE }} /t:Build /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=$platform /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=true /p:UapAppxPackageBuildMode=SideloadOnly /p:WindowsAppSDKSelfContained=true /p:UseVCLibStl=false /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##error:Build failed for $platform"
            exit 1
          }

      - name: Find APPX
        id: find_appx
        shell: pwsh
        run: |
          $platform = '${{ steps.platform.outputs.platform }}'
          $searchBase = ".\$platform\${{ env.CONFIGURATION }}"

          Write-Host "=== Listing $searchBase (top 200 entries) ==="
          if (Test-Path $searchBase) {
            Get-ChildItem -Path $searchBase -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 200 |
              ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Host "  Directory does not exist!"
          }

          # ONLY search in the platform-specific output directory — NO fallback
          Write-Host "=== Searching for .appx in: $searchBase ==="
          $allAppx = Get-ChildItem -Path $searchBase -Filter '*.appx' -Recurse -ErrorAction SilentlyContinue
          if ($allAppx) {
            Write-Host "Found $($allAppx.Count) .appx file(s):"
            foreach ($f in $allAppx) { Write-Host "  $($f.FullName)" }
            $appx = $allAppx | Select-Object -First 1
            echo "appx_path=$($appx.FullName)" >> $env:GITHUB_OUTPUT
            Write-Host "Selected: $($appx.FullName)"
          } else {
            Write-Host "##error:No .appx found in $searchBase — build may have failed to generate APPX"
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZBinary2CArray-WinUI3-${{ matrix.arch }}
          path: ${{ steps.find_appx.outputs.appx_path }}
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: |
            ${{ steps.platform.outputs.platform }}/${{ env.CONFIGURATION }}/**/*.log
            ${{ steps.platform.outputs.platform }}/${{ env.CONFIGURATION }}/**/*.err
          if-no-files-found: warn

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect APPX files
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          mkdir -p release
          echo "=== Artifacts directory ==="
          ls -laR artifacts/ || echo "artifacts/ is empty or missing"
          for dir in artifacts/*/; do
            dirname=$(basename "$dir")
            arch=$(echo "$dirname" | grep -oP '(x86|x64|ARM64)' || true)
            appx=$(find "$dir" -name '*.appx' -type f | head -1)
            if [ -n "$appx" ] && [ -n "$arch" ]; then
              cp "$appx" "release/ZBinary2CArray-WinUI3_${arch}.appx"
              echo "Added: ZBinary2CArray-WinUI3_${arch}.appx"
            else
              echo "WARNING: no appx found in $dir (arch=$arch, dirname=$dirname)"
            fi
          done
          echo "--- Final release files ---"
          ls -la release/
          count=$(find release -name '*.appx' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "##error:No APPX files collected!"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.appx
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
